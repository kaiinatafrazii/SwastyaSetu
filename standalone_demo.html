        setSelectedCat(KNOWLEDGE_BASE[catId] || KNOWLEDGE_BASE.other_emergency);
        setStepIdx(0);
        setCurrentView('guide');
      };

      const handleAnalyzeText = (text) => {
        const lower = text.toLowerCase();
        let matched = 'other_emergency';
        if (lower.includes('chest') || lower.includes('heart')) matched = 'chest_pain';
        else if (lower.includes('breath') || lower.includes('asthma')) matched = 'breathing_difficulty';
        else if (lower.includes('bleed') || lower.includes('cut')) matched = 'severe_bleeding';
        else if (lower.includes('unconscious') || lower.includes('faint') || lower.includes('collapse')) matched = 'unconsciousness';
        else if (lower.includes('chok') || lower.includes('throat')) matched = 'choking';
        else if (lower.includes('snake') || lower.includes('bite')) matched = 'snake_bite';
        else if (lower.includes('burn') || lower.includes('fire')) matched = 'burns';
        else if (lower.includes('bone') || lower.includes('fractur') || lower.includes('fall')) matched = 'fracture';

        setSelectedCat(KNOWLEDGE_BASE[matched]);
        setStepIdx(0);
        setCurrentView('guide');

                        <p className="text-xs text-slate-500 line-clamp-2 mt-0.5">
                          {t(cat.description, cat.descriptionHi)}
                        </p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* ─── DASHBOARD VIEW ─────────────────────────────── */}
            {currentView === 'dashboard' && (
              <div className="space-y-6 animate-fade-in">
                <button
                  onClick={() => setCurrentView('home')}
                  className="text-xs font-bold text-slate-500 hover:text-slate-800"
                >
                  ← {t('Back to Home', 'मुख्य पृष्ठ पर वापस')}
                </button>

                <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                  <h1 className="text-2xl font-extrabold text-slate-900">
                    {t('System & Triage Analytics', 'प्रणाली एवं सहायता एनालिटिक्स')}
                  </h1>
                  <p className="text-xs text-slate-500 mt-1">
                    {t('Aggregated metrics with zero patient PII stored.', 'अनाम डेटा और उच्च उपलब्धता मॉनिटरिंग।')}
                  </p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="p-4 rounded-2xl bg-white border border-slate-200 shadow-xs">
                    <span className="text-[11px] font-bold text-slate-400 uppercase">Total Sessions</span>
                    <div className="text-2xl font-extrabold text-slate-900 mt-1">142</div>
                  </div>
                  <div className="p-4 rounded-2xl bg-white border border-slate-200 shadow-xs">
                    <span className="text-[11px] font-bold text-slate-400 uppercase">Last 24h</span>
                    <div className="text-2xl font-extrabold text-red-600 mt-1">18</div>
                  </div>
                  <div className="p-4 rounded-2xl bg-white border border-slate-200 shadow-xs">
                    <span className="text-[11px] font-bold text-slate-400 uppercase">Critical (112)</span>
                    <div className="text-2xl font-extrabold text-red-700 mt-1">88</div>
                  </div>
                  <div className="p-4 rounded-2xl bg-white border border-slate-200 shadow-xs">
                    <span className="text-[11px] font-bold text-slate-400 uppercase">System Uptime</span>
                    <div className="text-2xl font-extrabold text-emerald-600 mt-1">99.9%</div>
                  </div>
                </div>

                <div className="p-5 rounded-2xl bg-white border border-slate-200 text-xs text-slate-600 space-y-2">
                  <div className="font-bold text-slate-800 text-sm">System Guardrail Engines:</div>
                  <div>✅ <strong>Safety Rules Engine:</strong> Deterministic Escalation Active</div>
                  <div>✅ <strong>AI Engine:</strong> Gemini 2.0 / Local Rule Fallback Configured</div>
                  <div>✅ <strong>Privacy Protocol:</strong> No PII Stored, Auto-cleared Memory</div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
